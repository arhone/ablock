<!DOCTYPE html>
<html>
<head>
    <title data-i18n="extName"></title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="hidden.css">
    <link rel="stylesheet" href="settings.css">
</head>
<body class="loading">
    <div id="panel">
        <div class="badges left">
            <div class="badge" id="https">HTTPS</div>
            <div class="badge" id="protocol">HTTP</div>
            <div class="badge" id="compression">—</div>
            <div class="badge" id="domains"></div>
        </div>
        <button id="button" type="button" autofocus data-i18n-title="toggle">
            <img id="bg" data-status="true" src="/images/ablock-128-bg.webp" alt="">
            <img id="logo" src="/images/ablock-128-empty.webp" alt="">
        </button>
        <div class="badges right">
            <div class="badge" id="blocked"></div>
            <div class="badge" id="trackers"></div>
            <div class="badge" id="speed">—</div>
            <div class="badge" id="weight">—</div>
        </div>
    </div>
    <div id="status-row">
        <div id="status" data-status="true"></div>
        <button class="icon-button" id="note-add" type="button" hidden data-i18n-title="noteTitle">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.5l3 3L6 13H3v-3z M8.5 4.5l3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </button>
    </div>
    <p id="note" hidden tabindex="0" role="button" data-i18n-title="noteTitle"></p>
    <textarea id="note-input" hidden rows="2" maxlength="200" data-i18n-placeholder="notePlaceholder" data-i18n-title="noteTitle"></textarea>
    <section id="score" hidden>
        <div id="score-head">
            <button id="score-more" type="button" aria-expanded="false" aria-controls="score-body">
                <span id="score-label" data-i18n="scoreLabel"></span>
                <span id="meter" aria-hidden="true"></span>
                <span id="score-value">—</span>
            </button>
            <span class="chevron" aria-hidden="true"></span>
        </div>
        <div id="score-body" hidden>
            <div class="board" id="board"></div>
            <div id="audit-body">
                <div class="audit-group" id="about">
                    <h3 data-i18n="auditAbout"></h3>
                    <dl id="details">
                        <dt data-i18n="serverLabel"></dt>
                        <dd id="server"></dd>
                        <dt data-i18n="techLabel"></dt>
                        <dd id="tech"></dd>
                        <dt id="extra-label" data-i18n="extraLabel"></dt>
                        <dd id="extra"></dd>
                    </dl>
                </div>
            </div>
            <div id="audit-foot" hidden>
                <button class="action" id="extended-off" type="button" data-i18n="extendedOff" data-i18n-title="extendedOffTitle"></button>
            </div>
            <div class="card" id="report" data-i18n-title="reportTitle">
                <span data-i18n="reportText"></span>
                <button class="tool" id="share" type="button" data-i18n-title="share">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4h7v7M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
                </button>
            </div>
            <div class="card" id="share-menu" hidden>
                <span class="tools">
                    <button class="tool" id="share-image" type="button" data-i18n-title="copyImage">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/><path d="m8 18 3.5-3.5 2.5 2.5 2-2 4 4"/><circle cx="15.5" cy="11.5" r="1"/></svg>
                    </button>
                    <button class="tool" id="share-save" type="button" data-i18n-title="saveImage">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19h14"/></svg>
                    </button>
                    <button class="tool" id="share-text" type="button" data-i18n-title="copyText">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
                    </button>
                    <button class="tool" id="share-system" type="button" hidden data-i18n-title="shareSystem">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="m8.2 10.8 7.6-4.1m-7.6 6.5 7.6 4.1"/></svg>
                    </button>
                </span>
                <span class="networks"></span>
            </div>
        </div>
    </section>
    <!-- Область оповещений: одна карточка за раз, порядок — в popup.js (renderNotices) -->
    <div id="notices">
        <div class="card notice" id="rate" hidden>
            <span data-i18n="rateText"></span>
            <a class="action" id="rate-button" target="_blank" data-i18n="rateButton"></a>
            <button class="tool close" id="rate-close" type="button" data-i18n-title="askClose">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
            </button>
        </div>
        <div class="card notice" id="ask" hidden>
            <span id="ask-text"></span>
            <a class="action" id="ask-button" target="_blank" data-i18n="donate" data-i18n-title="donateTitle"></a>
            <button class="tool close" id="ask-close" type="button" data-i18n-title="askClose">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
            </button>
        </div>
        <div class="card notice" id="extended" hidden>
            <span data-i18n="extendedText"></span>
            <button class="action" id="extended-button" type="button" data-i18n="extendedButton"></button>
        </div>
        <div class="card notice" id="stats" hidden>
            <span id="stats-text" tabindex="0"></span>
            <a class="tool" id="stats-rate" target="_blank" data-i18n-title="statsRate">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v10H4.5a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zm0 0 4-6.5a2 2 0 0 1 3.4 1.8L13.5 10h5a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.3 20H7"/></svg>
            </a>
            <button class="tool" id="stats-share" type="button" aria-expanded="false" aria-controls="stats-menu" data-i18n-title="statsShare">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4h7v7M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
            </button>
            <div id="stats-menu" hidden>
                <span class="tools">
                    <button class="tool" id="stats-copy" type="button" data-i18n-title="copyLink">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
                    </button>
                    <button class="tool" id="stats-system" type="button" hidden data-i18n-title="shareSystem">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="m8.2 10.8 7.6-4.1m-7.6 6.5 7.6 4.1"/></svg>
                    </button>
                </span>
                <span class="networks"></span>
            </div>
        </div>
    </div>
    <label class="card" id="site-row" hidden data-i18n-title="siteTitle">
        <input type="checkbox" id="site">
        <span id="site-text"></span>
    </label>
    <label class="card" id="cookies-row" data-i18n-title="cookiesTitle" hidden>
        <input type="checkbox" id="cookies">
        <span data-i18n="cookiesLabel"></span>
    </label>
    <label class="card" id="incognito-row" data-i18n-title="incognitoTitle" hidden>
        <input type="checkbox" id="incognito">
        <span data-i18n="incognitoLabel"></span>
    </label>
    <div class="card" id="pick-row" hidden>
        <div id="pick-copy">
            <div id="pick-heading">
                <span id="pick-label" data-i18n="pickLabel"></span>
                <button class="icon-button" id="pick-count" type="button" hidden></button>
            </div>
            <div id="pick-hint" aria-live="polite" hidden>
                <span id="pick-message"></span>
            </div>
        </div>
        <button class="icon-button" id="pick" type="button" data-i18n-title="pickTitle">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m9 3 4 4M10.5 1.5l4 4-2 2-4-4zM9 5 2.5 11.5 2 14l2.5-.5L11 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </div>
    <div class="card" id="clear-row" hidden>
        <span data-i18n="clearLabel"></span>
        <button class="icon-button" id="clear" type="button" data-i18n-title="clearTitle">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M6.5 4V2.5h3V4M4 4l.7 9.5h6.6L12 4M6.8 6.5v4.5M9.2 6.5v4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="clear-text" hidden data-i18n="clearConfirm"></span>
        </button>
    </div>
    <footer>
        <button id="settings-open" type="button" data-i18n-title="settingsTitle">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.7 1.5h2.6l.4 1.7 1.1.5 1.5-.9 1.8 1.8-.9 1.5.5 1.1 1.8.4v2.6l-1.8.4-.5 1.1.9 1.5-1.8 1.8-1.5-.9-1.1.5-.4 1.8H6.7l-.4-1.8-1.1-.5-1.5.9-1.8-1.8.9-1.5-.5-1.1-1.8-.4V6.7l1.8-.4.5-1.1-.9-1.5 1.8-1.8 1.5.9 1.1-.5z"/><circle cx="8" cy="8" r="2.3"/></svg>
        </button>
        <button id="theme" type="button">
            <svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.6A5.75 5.75 0 0 1 6.4 2.5a5.75 5.75 0 1 0 7.1 7.1z"/></svg>
            <svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.9"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>
        </button>
        <a id="donate" target="_blank" hidden data-i18n="donate" data-i18n-title="donateTitle"></a>
        <a class="icon-link" href="https://t.me/ablockinfo" target="_blank" data-i18n-title="telegram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </a>
        <a class="icon-link" href="https://github.com/arhone/ablock" target="_blank" data-i18n-title="github">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-4 1-4-2-6-2m12 5v-4c0-1-.3-2-1-2 4-.5 6-2 6-6 0-1-.4-2-1-3 .3-1 .3-3-.2-4-2 0-3 1-4 2a12 12 0 0 0-6 0C7 4 6 3 4 3c-.5 1-.5 3-.2 4C3 8 3 9 3 10c0 4 2 5.5 6 6-.6.5-1 1-1 2v4"/></svg>
        </a>
    </footer>
    <div id="tip" role="tooltip" hidden></div>
    <!-- Значки соцсетей для меню «Поделиться» (отчёт о сайте и ссылка на расширение): popup.js берёт нужные по языку.
         Градиент Max — отдельно: значок бывает в двух меню, а одинаковый id из скрытого меню не рисуется -->
    <svg id="defs" aria-hidden="true"><defs><linearGradient id="max-bg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3a8bff"/><stop offset="1" stop-color="#8b3ffd"/></linearGradient></defs></svg>
    <template id="networks">
        <a class="network" data-network="telegram" target="_blank">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#229ed9"/><path d="M5.4 11.7 17.3 7c.6-.2 1.1.1.9.9l-2 9.5c-.1.7-.6.8-1.1.5l-3.1-2.3-1.5 1.4c-.2.2-.3.3-.6.3l.2-3.1 5.7-5.2c.3-.2-.1-.3-.4-.1l-7 4.4-3-.9c-.7-.2-.7-.6.1-.9z" fill="#fff"/></svg>
        </a>
        <a class="network" data-network="vk" target="_blank">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7" fill="#07f"/><path d="M12.8 17C7.3 17 4.2 13.3 4 7h2.8c.1 4.6 2.1 6.6 3.7 7V7h2.6v4c1.6-.2 3.3-2 3.8-4h2.6c-.4 2.4-2.2 4.2-3.4 4.9 1.3.6 3.3 2.1 4 5.1h-2.9c-.6-1.9-2.1-3.4-4.1-3.6V17z" fill="#fff"/></svg>
        </a>
        <a class="network" data-network="ok" target="_blank">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#ee8208"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.3" r="2.5"/><path d="M8.7 12.7c2 1.3 4.6 1.3 6.6 0M9.4 17.8l2.6-2.6 2.6 2.6"/></g></svg>
        </a>
        <a class="network" data-network="max" target="_blank">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7" fill="url(#max-bg)"/><path d="M12 6.3a5.4 5.4 0 1 1-3 9.9l-2.6 1.1.8-2.7A5.4 5.4 0 0 1 12 6.3z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>
        </a>
        <a class="network" data-network="x" target="_blank">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#000"/><path d="M15.6 6.5h1.8l-4 4.5 4.7 6.2h-3.7l-2.9-3.8-3.3 3.8H6.4l4.3-4.9-4.5-5.8h3.8l2.6 3.4zm-.6 9.6h1L9.4 7.5H8.3z" fill="#fff"/></svg>
        </a>
        <a class="network" data-network="whatsapp" target="_blank">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#25d366"/><path d="M12 5.6a6.4 6.4 0 0 0-5.5 9.7l-.9 3.1 3.2-.8A6.4 6.4 0 1 0 12 5.6z" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M9.7 9c.2-.3.4-.3.6-.3h.4c.1 0 .3 0 .4.3l.6 1.4c0 .1 0 .3-.1.4l-.4.5c-.1.1-.1.2 0 .4.5.8 1.2 1.5 2 1.9.2.1.3.1.4 0l.5-.6c.1-.2.3-.2.4-.1l1.4.7c.2.1.2.2.2.3 0 .3-.1.9-.5 1.2-.4.3-1.1.6-2 .3-1.2-.4-2.4-1.2-3.3-2.3-.8-1-1.2-2-1.2-2.7 0-.6.2-1 .6-1.4z" fill="#fff"/></svg>
        </a>
        <a class="network" data-network="viber" target="_blank">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7" fill="#7360f2"/><path d="M12 5c3.6 0 6 1.6 6 5.5s-2.4 5.5-6 5.5h-.8L9 18.3v-2.6c-2-.7-3-2.4-3-5.2C6 6.6 8.4 5 12 5z" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 8.4c.2-.2.5-.2.7 0l.8 1c.2.2.1.5 0 .7l-.3.3c.3.7.9 1.3 1.6 1.6l.3-.3c.2-.2.5-.2.7 0l1 .8c.2.2.2.5 0 .7l-.4.5c-.3.3-.8.4-1.2.3-1.9-.6-3.4-2.1-4-4-.1-.4 0-.9.3-1.2z" fill="#fff"/></svg>
        </a>
        <a class="network" data-network="facebook" target="_blank">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#1877f2"/><path d="M13.3 19v-5.9h2l.3-2.4h-2.3V9.2c0-.7.2-1.2 1.2-1.2h1.2V5.9c-.2 0-1-.1-1.8-.1-1.8 0-3.1 1.1-3.1 3.1v1.8h-2v2.4h2V19z" fill="#fff"/></svg>
        </a>
        <a class="network" data-network="linkedin" target="_blank">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#0a66c2"/><path d="M6.8 10h2.4v7.5H6.8zM8 6a1.4 1.4 0 1 1 0 2.8A1.4 1.4 0 0 1 8 6m2.9 4h2.3v1c.3-.6 1.1-1.2 2.3-1.2 2.4 0 2.9 1.6 2.9 3.7v4H16v-3.6c0-.8 0-1.9-1.2-1.9s-1.4.9-1.4 1.8v3.7h-2.4z" fill="#fff"/></svg>
        </a>
        <a class="network" data-network="reddit" target="_blank">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#ff4500"/><g fill="#fff"><circle cx="6.9" cy="11.4" r="1.4"/><circle cx="17.1" cy="11.4" r="1.4"/><ellipse cx="12" cy="13.8" rx="5.6" ry="3.9"/><circle cx="16.4" cy="6.4" r="1.1"/></g><path d="M12 9.9l.9-3.9 3.5.4" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/><g fill="#ff4500"><circle cx="9.7" cy="13.2" r="1"/><circle cx="14.3" cy="13.2" r="1"/></g></svg>
        </a>
        <a class="network" data-network="hackernews" target="_blank">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#f60"/><path d="M7.4 6h2.2l2.4 4.9L14.4 6h2.2L13 12.7V18h-2v-5.3z" fill="#fff"/></svg>
        </a>
        <a class="network" data-network="weibo" target="_blank">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#e6162d"/><ellipse cx="10.8" cy="14.3" rx="5.6" ry="3.8" fill="#fff"/><ellipse cx="10.4" cy="14.7" rx="2.1" ry="1.5" fill="#e6162d"/><path d="M14.4 7.6a3.1 3.1 0 0 1 3.4 3.5M14.5 5.3a5.4 5.4 0 0 1 5.7 6" fill="none" stroke="#ffc700" stroke-width="1.4" stroke-linecap="round"/></svg>
        </a>
    </template>
    <section id="hidden-screen" hidden></section>
    <section id="settings-screen" hidden>
        <div class="settings-head">
            <button id="settings-back" type="button" data-i18n-title="settingsBack"><span>‹</span></button>
            <h2 data-i18n="settingsTitle"></h2>
        </div>
        <label class="settings-field" for="lang"><span data-i18n="settingsLang"></span><select id="lang"></select></label>
        <label class="settings-field" for="badge-mode"><span data-i18n="settingsBadge"></span>
            <select id="badge-mode"><option value="count" data-i18n="settingsBadgeCount"></option><option value="status" data-i18n="settingsBadgeStatus"></option><option value="off" data-i18n="settingsBadgeOff"></option></select>
        </label>
        <label class="settings-picker"><span><span data-i18n="settingsPickerAnimation"></span><small data-i18n="settingsPickerAnimationHint"></small></span><input type="checkbox" id="picker-animation" checked></label>
    </section>
    <script src="company-owner.js"></script>
    <script src="popup.js"></script>
    <script src="hidden.js"></script>
    <script src="settings.js"></script>
</body>
</html>
