sonar.projectKey=arhone-ablock
sonar.projectName=arhone-ablock

# Исходный код проекта
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Исключения из статического анализа:
# - зависимости и артефакты: node_modules/**, dist/**, build/**, coverage/**
# - служебные каталоги: .agents/**, .idea/**, .playwright-mcp/**, .scannerwork/**
# - переменные окружения и секреты: .env, **/.env
# - lock-файлы: package-lock.json
# - сторонние фильтры и правила (тяжёлые JSON списки EasyList, uBlock и др.): src/rules/**
# - служебные метаданные магазина Chrome: src/_metadata/**
# - сторонние стили: src/content/cookies.css
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  build/**,\
  coverage/**,\
  .agents/**,\
  .idea/**,\
  .playwright-mcp/**,\
  .scannerwork/**,\
  .env,\
  **/.env,\
  package-lock.json,\
  src/rules/**,\
  src/_metadata/**,\
  src/content/cookies.css

# Исключение из проверки дублирования кода (справочные данные и локализации)
sonar.cpd.exclusions=\
  src/data/**,\
  src/_locales/**,\
  src/rules/**
