<!DOCTYPE html>
<html lang="ru">
<head>
    <title>ABlock - Блокировщик рекламы</title>
    <meta charset="utf-8">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f7f9;
            --text: #1f2328;
            --muted: #6b7280;
            --border: #e3e5e8;
            --on: #16a34a;
            --off: #dc2626;
            --warn: #d97706;
            --none: #9ca3af;
            --pill: #ffffff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1d2024;
                --text: #e6e8eb;
                --muted: #9aa1ab;
                --border: #2f3338;
                --pill: #262a2f;
            }
            /* Чёрный контур щита иначе сливается с фоном */
            #logo {
                filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.6));
            }
        }
        * {
            box-sizing: border-box;
        }
        body {
            width: 360px;
            margin: 0;
            padding: 16px 16px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: var(--bg);
            color: var(--text);
            font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        body.loading {
            visibility: hidden;
        }

        /* Щит-переключатель */
        #button {
            position: relative;
            width: 112px;
            height: 112px;
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            border-radius: 24px;
            transition: transform 0.15s ease;
        }
        #button:hover {
            transform: scale(1.04);
        }
        #button:active {
            transform: scale(0.97);
        }
        #button:focus-visible {
            outline: 2px solid var(--on);
            outline-offset: 4px;
        }
        #button img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        #bg {
            transition: opacity 0.3s ease, filter 0.3s ease;
            filter: drop-shadow(0 0 6px color-mix(in srgb, var(--on) 60%, transparent));
        }
        #bg[data-status="false"] {
            opacity: 0.2;
            filter: grayscale(1) drop-shadow(0 0 6px color-mix(in srgb, var(--off) 60%, transparent));
        }

        /* Щит и значки вокруг */
        #panel {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
            align-self: stretch;
        }
        .badges {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .badges.left {
            align-items: flex-end;
        }
        .badges.right {
            align-items: flex-start;
        }
        .badge {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--pill);
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            cursor: default;
            --color: var(--none);
            color: var(--color);
        }
        .badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color);
        }
        .badge[data-state="good"] {
            --color: var(--on);
        }
        .badge[data-state="warn"] {
            --color: var(--warn);
        }
        .badge[data-state="bad"] {
            --color: var(--off);
        }

        /* Статус */
        #status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        #status::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--on);
            transition: background 0.3s ease;
        }
        #status[data-status="false"]::before {
            background: var(--off);
        }

        /* Ссылки */
        footer {
            align-self: stretch;
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            padding: 10px 0;
            border-top: 1px solid var(--border);
        }
        footer a {
            color: var(--muted);
            text-decoration: none;
            transition: color 0.15s ease;
        }
        footer a:hover {
            color: var(--text);
        }
    </style>
</head>
<body class="loading">
    <div id="panel">
        <div class="badges left">
            <div class="badge" id="https">HTTPS</div>
            <div class="badge" id="protocol">HTTP</div>
            <div class="badge" id="speed">—</div>
        </div>
        <button id="button" type="button" title="Включить / выключить">
            <img id="bg" data-status="true" src="image/ablock-128-bg.png" alt="">
            <img id="logo" src="image/ablock-128-empty.png" alt="">
        </button>
        <div class="badges right">
            <div class="badge" id="blocked">Блок —</div>
            <div class="badge" id="trackers">Трекеры —</div>
            <div class="badge" id="domains">Домены —</div>
        </div>
    </div>
    <div id="status" data-status="true">Защита включена</div>
    <footer>
        <a href="https://t.me/ablockinfo" target="_blank" title="Группа в телеграм">Telegram</a>
        <a href="https://github.com/arhone/ablock" target="_blank" title="Совместная разработка">Github</a>
    </footer>
    <script src="/js/popup.js"></script>
</body>
</html>
